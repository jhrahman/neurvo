# Neurvo sample workspace: a small product company ("ShopEase") plus Neurvo itself and the platform team.
# Dates are offsets in days from the day the seed runs, so the data always looks current.

statuses:
  - { key: todo,        name: "To Do",        color: "#8C959F", renames: ["New"], default: true }
  - { key: in_progress, name: "In Progress",  color: "#1276B9", renames: ["In progress"] }
  - { key: in_review,   name: "In Review",    color: "#8250DF", renames: ["Specified"] }
  - { key: ready_qa,    name: "Ready for QA", color: "#1B998B", renames: ["Developed"] }
  - { key: in_qa,       name: "In QA",        color: "#D97706", renames: ["In testing"] }
  - { key: reopened,    name: "Reopened",     color: "#CF222E", renames: ["Test failed"] }
  - { key: waiting,     name: "Waiting on Customer", color: "#9A6700", renames: [] }
  - { key: blocked,     name: "Blocked",      color: "#82071E", renames: ["On hold"] }
  - { key: done,        name: "Done",         color: "#1F883D", renames: ["Closed"], closed: true, done_ratio: 100 }
  - { key: wont_do,     name: "Won't Do",     color: "#57606A", renames: ["Rejected"], closed: true }

types:
  - { key: epic,           name: "Epic",            color: "#8250DF", renames: [],             statuses: [todo, in_progress, blocked, done, wont_do] }
  - { key: story,          form_section: "Delivery", name: "Story",           color: "#1F883D", renames: ["User story"], statuses: [todo, in_progress, in_review, ready_qa, in_qa, blocked, done, wont_do] }
  - { key: task,           form_section: "Delivery", name: "Task",            color: "#1276B9", renames: [],             statuses: [todo, in_progress, in_review, ready_qa, in_qa, blocked, done, wont_do] }
  - { key: subtask,        name: "Sub-task",        color: "#0E8A9E", renames: [],             statuses: [todo, in_progress, in_review, ready_qa, in_qa, blocked, done, wont_do] }
  - { key: bug,            form_section: "Bug details", name: "Bug",             color: "#CF222E", renames: [],             statuses: [todo, in_progress, in_review, ready_qa, in_qa, reopened, blocked, done, wont_do] }
  - { key: feature_request, form_section: "Request", name: "Feature Request", color: "#0969DA", renames: ["Feature"],   statuses: [todo, in_progress, in_review, ready_qa, in_qa, blocked, done, wont_do] }
  - { key: change_request, form_section: "Request", name: "Change Request",  color: "#BC4C00", renames: [],             statuses: [todo, in_progress, in_review, ready_qa, in_qa, blocked, done, wont_do] }
  - { key: support_request, form_section: "Support details", name: "Support Request", color: "#BF3989", renames: [], roadmap: false, statuses: [todo, in_progress, waiting, reopened, done, wont_do] }
  - { key: milestone,      name: "Milestone",       color: "#6A6FA0", renames: [],             statuses: [todo, in_progress, done], milestone: true }

obsolete_types: ["Summary task", "All CFS", "Required CF"]

priorities:
  - { name: "Low",      renames: ["Low"] }
  - { name: "Medium",   renames: ["Normal"], default: true }
  - { name: "High",     renames: ["High"] }
  - { name: "Critical", renames: ["Immediate"] }

templates:
  bug: |
    **Summary**
    One sentence describing the defect.

    **Steps to reproduce**
    1.
    2.
    3.

    **Expected result**

    **Actual result**

    **Evidence**
    Screenshots, logs or a screen recording (attach below).
  story: |
    **As a** <type of user> **I want** <goal> **so that** <reason>.

    **Acceptance criteria**
    - [ ]
    - [ ]

    **Out of scope**
  feature_request: |
    **Problem**
    What problem does this solve, and for whom?

    **Proposed solution**

    **Business value**
    Who asked for it and what changes if we build it?

    **Alternatives considered**
  change_request: |
    **Requested change**

    **Reason for change**

    **Impact**
    Scope, schedule, cost and risk.

    **Approval**
    Approved by / date.
  support_request: |
    **Customer request**
    What does the customer need or report? Paste their message.

    **Customer and account**
    Who is affected: company, plan, number of users.

    **Already tried**

    **Reply sent / resolution**

    **Escalation**
    Link the bug, feature request or change request when engineering work is needed.
  task: |
    **What needs to be done**

    **Definition of done**
    - [ ]

custom_fields:
  - { key: severity,     name: "Severity",       format: list,   options: ["Critical", "Major", "Minor", "Trivial"],            types: [bug] }
  - { key: environment,  name: "Environment",    format: list,   options: ["Development", "QA", "Staging", "Production"],       types: [bug] }
  - { key: platform,     name: "Platform",       format: list,   options: ["Web", "iOS", "Android", "API", "Infrastructure"],   types: [bug] }
  - { key: found_in,     name: "Found in build", format: string,                                                                  types: [bug] }
  - { key: fixed_in,     name: "Fixed in build", format: string,                                                                  types: [bug, story, task] }
  - { key: requested_by, name: "Requested by",   format: string,                                                                  types: [feature_request, change_request] }
  - { key: impact,       name: "Business impact", format: list,  options: ["High", "Medium", "Low"],                            types: [feature_request, change_request, support_request] }
  - { key: customer,     name: "Customer",       format: string,                                                                  types: [support_request] }
  - { key: channel,      name: "Support channel", format: list,  options: ["Email", "Live chat", "Phone", "Customer portal", "In-app"], types: [support_request] }

roles:
  - { name: "Project Manager", copy_from: "Project admin" }
  - { name: "Developer",       copy_from: "Member" }
  - { name: "QA Engineer",     copy_from: "Member" }
  - { name: "DevOps Engineer", copy_from: "Member" }

users:
  - { key: ayesha, first: "Ayesha", last: "Karim",    title: "Product Manager",       group: "Product",    role: "Project Manager" }
  - { key: daniel, first: "Daniel", last: "Brooks",   title: "Tech Lead",             group: "Developers", role: "Project Manager" }
  - { key: rafi,   first: "Rafi",   last: "Hasan",    title: "Backend Developer",     group: "Developers", role: "Developer" }
  - { key: sofia,  first: "Sofia",  last: "Martins",  title: "Frontend Developer",    group: "Developers", role: "Developer" }
  - { key: kenji,  first: "Kenji",  last: "Watanabe", title: "Mobile Developer",      group: "Developers", role: "Developer" }
  - { key: priya,  first: "Priya",  last: "Nair",     title: "Full-stack Developer",  group: "Developers", role: "Developer" }
  - { key: nusrat, first: "Nusrat", last: "Jahan",    title: "QA Lead",               group: "QA",         role: "QA Engineer" }
  - { key: marco,  first: "Marco",  last: "Rossi",    title: "QA Automation Engineer", group: "QA",        role: "QA Engineer" }
  - { key: lena,   first: "Lena",   last: "Fischer",  title: "QA Engineer",           group: "QA",         role: "QA Engineer" }
  - { key: tanvir, first: "Tanvir", last: "Ahmed",    title: "DevOps Engineer",       group: "DevOps",     role: "DevOps Engineer" }

modules: [work_package_tracking, backlogs, board_view, gantt, calendar_view, documents, meetings, activity, github, gitlab]

projects:
  - key: SHOP
    name: "ShopEase"
    description: "Our e-commerce product. Parent project for the web storefront and the mobile apps; product-wide defects are triaged on the SQA Defects board."
    status: { code: on_track, explanation: "Web 3.5.0 and Mobile 2.8.0 on schedule; two Critical bugs under active work." }
    members: [ayesha, daniel, rafi, sofia, kenji, priya, nusrat, marco, lena, tanvir]
    categories: []
    sprints: false

  - key: WEB
    name: "ShopEase Web"
    parent: SHOP
    description: "Customer-facing storefront (Next.js) and checkout."
    status: { code: at_risk, explanation: "3.5.0 release depends on WEB-18 (payment 500) and WEB-20 (reopened cart bug)." }
    members: [ayesha, daniel, rafi, sofia, priya, nusrat, marco, lena, tanvir]
    categories: ["Checkout", "Search", "Catalogue", "Account", "Payments"]
    sprints: true
    versions:
      - { name: "Web 3.4.0", status: closed, start: -42, due: -14, description: "Saved addresses, faster category pages." }
      - { name: "Web 3.5.0", status: open,   start: -14, due: 11,  description: "Checkout v2 and typo-tolerant search." }
      - { name: "Web 3.6.0", status: open,   start: 11,  due: 39,  description: "Guest checkout and wishlist sharing." }
    boards:
      - { name: "Web Kanban", kind: status, statuses: [todo, in_progress, in_review, ready_qa, in_qa, done] }

  - key: MOB
    name: "ShopEase Mobile"
    parent: SHOP
    description: "iOS and Android apps (React Native)."
    status: { code: on_track, explanation: "Push notifications in progress; Android 14 crash is the top priority." }
    members: [ayesha, daniel, kenji, priya, nusrat, marco, lena]
    categories: ["Orders", "Notifications", "Payments", "Login"]
    sprints: true
    versions:
      - { name: "Mobile 2.8.0", status: open, start: -14, due: 18, description: "Order push notifications, Android 14 fixes." }

  - key: OPS
    name: "Platform & DevOps"
    description: "Infrastructure, CI/CD, observability and data protection for all products."
    status: { code: off_track, explanation: "Backups failed silently for 3 days; fix and alerting in progress (OPS-7)." }
    members: [daniel, tanvir, rafi, nusrat]
    categories: ["CI/CD", "Kubernetes", "Database", "Monitoring", "Security"]
    sprints: true

  - key: NEU
    name: "Neurvo"
    description: "Our own project management tool. Dogfooding: features and bugs for Neurvo itself."
    status: { code: on_track, explanation: "MVP scope done except the command palette." }
    members: [ayesha, daniel, priya, sofia, nusrat, tanvir]
    categories: ["UI", "Workflow", "Integrations"]
    sprints: true
    versions:
      - { name: "Neurvo 0.1 (MVP)", status: open, start: -14, due: 14, description: "Branding, themes, Jira-style workflow and SQA board." }
      - { name: "Neurvo 0.2",       status: open, start: 14,  due: 45, description: "Docmost integration and Slack notifications." }

product_boards:
  - { project: SHOP, name: "SQA Defects",   types: [bug],             statuses: [todo, in_progress, ready_qa, in_qa, reopened, done] }
  - { project: SHOP, name: "Support Queue", types: [support_request], statuses: [todo, in_progress, waiting, reopened, done] }

queries:
  - { project: SHOP, name: "Open bugs (all products)",  types: [bug], open: true, subprojects: true, sort: [[priority, desc], [updated_at, desc]], columns: [id, subject, type, status, assigned_to, priority, cf_severity, cf_environment, project] }
  - { project: SHOP, name: "Ready for QA",             statuses: [ready_qa, in_qa], subprojects: true, sort: [[updated_at, desc]], columns: [id, subject, type, status, assigned_to, priority, cf_fixed_in, project] }
  - { project: SHOP, name: "Production incidents",     types: [bug], cf: { environment: "Production" }, subprojects: true, sort: [[priority, desc]], columns: [id, subject, status, assigned_to, priority, cf_severity, project] }
  - { project: SHOP, name: "Feature & change requests", types: [feature_request, change_request], open: true, subprojects: true, sort: [[updated_at, desc]], columns: [id, subject, type, status, cf_requested_by, cf_impact, project] }
  - { project: SHOP, name: "Support queue",           types: [support_request], open: true, subprojects: true, sort: [[priority, desc], [updated_at, desc]], columns: [id, subject, status, priority, assigned_to, cf_customer, cf_channel, cf_impact, project] }
  - { project: OPS,  name: "Open infrastructure work", open: true, sort: [[priority, desc]], columns: [id, subject, type, status, assigned_to, priority, category] }

# Work packages. `ref` lets children, relations and comments point at an item.
# sprint: previous | current | next. Statuses/types use the keys above.
work_packages:
  WEB:
    - { ref: web_epic_checkout, type: epic, subject: "Checkout v2: one-page checkout", status: in_progress, assignee: daniel, author: ayesha, priority: High, version: "Web 3.5.0", start: -20, due: 25,
        description: "Replace the 4-step checkout with a single page. Target: +8% checkout conversion, -30% time to order." }
    - { ref: web_saved_cards, parent: web_epic_checkout, type: story, subject: "Pay with a saved card at checkout", status: in_progress, assignee: sofia, author: ayesha, priority: High, sprint: current, points: 8, version: "Web 3.5.0", category: "Checkout",
        description: "**As a** returning shopper **I want** to pick one of my saved cards **so that** I can pay without typing card details.\n\n**Acceptance criteria**\n- [x] Saved cards listed with brand, last 4 digits and expiry\n- [ ] Expired cards shown disabled\n- [ ] 3-D Secure challenge still triggered when the bank requires it" }
    - { ref: web_cards_ui, parent: web_saved_cards, type: subtask, subject: "Saved-card selector component", status: in_review, assignee: sofia, author: sofia, sprint: current, points: 3, category: "Checkout" }
    - { ref: web_cards_api, parent: web_saved_cards, type: subtask, subject: "GET /payment-methods endpoint with PSP token lookup", status: done, assignee: rafi, author: rafi, sprint: current, points: 3, category: "Payments", fixed_in: "3.5.0-rc.1" }
    - { ref: web_cards_e2e, parent: web_saved_cards, type: subtask, subject: "E2E tests: saved-card payment incl. 3-D Secure", status: todo, assignee: marco, author: nusrat, sprint: current, points: 2, category: "Checkout" }
    - { ref: web_promo, parent: web_epic_checkout, type: story, subject: "Apply promo code inline without page reload", status: ready_qa, assignee: priya, author: ayesha, priority: Medium, sprint: current, points: 5, version: "Web 3.5.0", category: "Checkout", fixed_in: "3.5.0-rc.2" }
    - { ref: web_guest, parent: web_epic_checkout, type: story, subject: "Guest checkout with email-only account", status: todo, author: ayesha, priority: Medium, sprint: next, points: 8, version: "Web 3.6.0", category: "Checkout" }
    - { ref: web_epic_search, type: epic, subject: "Search relevance improvements", status: in_progress, assignee: rafi, author: ayesha, priority: Medium, version: "Web 3.5.0", start: -30, due: 11 }
    - { ref: web_typo, parent: web_epic_search, type: story, subject: "Typo-tolerant product search", status: in_progress, assignee: rafi, author: ayesha, priority: High, sprint: current, points: 5, version: "Web 3.5.0", category: "Search" }
    - { ref: web_synonyms, parent: web_epic_search, type: story, subject: "Search synonyms managed by merchandisers", status: todo, author: ayesha, sprint: next, points: 5, category: "Search" }
    - { ref: web_addresses, type: story, subject: "Saved addresses in account", status: done, assignee: priya, author: ayesha, sprint: previous, points: 5, version: "Web 3.4.0", category: "Account", fixed_in: "3.4.0" }
    - { ref: web_lcp_task, type: task, subject: "Lazy-load below-the-fold images on category pages", status: done, assignee: sofia, author: daniel, sprint: previous, points: 3, version: "Web 3.4.0", category: "Catalogue" }
    - { ref: web_fr_wishlist, type: feature_request, subject: "Share wishlist via link", status: todo, author: ayesha, priority: Medium, version: "Web 3.6.0", requested_by: "Customer Success (12 tickets in Q3)", impact: "Medium",
        description: "**Problem**\nShoppers screenshot their wishlist to share gift ideas; links would bring the recipient straight to the products.\n\n**Business value**\nRequested in 12 support tickets last quarter; expected to lift gift purchases before the holidays." }
    - { ref: web_fr_storefront_dark, type: feature_request, subject: "Dark mode for the storefront", status: todo, author: sofia, priority: Low, requested_by: "Design team", impact: "Low" }
    - { ref: web_cr_shipping, type: change_request, subject: "Raise free-shipping threshold from $50 to $75", status: in_progress, assignee: priya, author: ayesha, priority: High, sprint: current, points: 2, version: "Web 3.5.0", requested_by: "Finance (CFO approval 28 Oct)", impact: "High",
        description: "**Requested change**\nFree shipping applies from $75 instead of $50 (cart total after discounts).\n\n**Reason for change**\nCarrier rates rose 18% in October.\n\n**Impact**\nBanner copy, cart progress bar, checkout totals and 3 email templates.\n\n**Approval**\nApproved by Finance on 28 Oct." }
    - { ref: web_cr_cookie, type: change_request, subject: "Update cookie banner text after legal review", status: done, assignee: sofia, author: ayesha, sprint: previous, points: 1, version: "Web 3.4.0", requested_by: "Legal", impact: "Medium" }
    - { ref: bug_promo_total, type: bug, subject: "Order total not updated after removing a promo code", status: in_progress, assignee: priya, author: lena, priority: High, sprint: current, version: "Web 3.5.0", category: "Checkout",
        severity: Major, environment: QA, platform: Web, found_in: "3.5.0-rc.2",
        description: "**Summary**\nRemoving an applied promo code leaves the discounted total on screen.\n\n**Steps to reproduce**\n1. Add any product over $40 to the cart\n2. Apply code `AUTUMN10` at checkout\n3. Remove the code with the ✕ next to it\n\n**Expected result**\nOrder total returns to the full price.\n\n**Actual result**\nTotal stays discounted until the page is reloaded; the payment request uses the discounted amount.\n\n**Evidence**\nHAR file and screen recording attached in the QA channel." }
    - { ref: bug_expiry_500, type: bug, subject: "Payment page returns 500 when the card expires this month", status: todo, assignee: rafi, author: nusrat, priority: Critical, sprint: current, version: "Web 3.5.0", category: "Payments",
        severity: Critical, environment: Staging, platform: Web, found_in: "3.5.0-rc.2",
        description: "**Steps to reproduce**\n1. Log in as a user with a saved card expiring in the current month (test card 4000 0000 0000 3220, exp 11/26)\n2. Go to checkout and select the card\n3. Press **Pay now**\n\n**Expected result**\nPayment succeeds (card is valid until the end of the month).\n\n**Actual result**\nHTTP 500. Sentry: `ArgumentError: invalid date` in `PaymentMethods::ExpiryValidator`." }
    - { ref: bug_lcp, type: bug, subject: "Category page LCP 6.2s on mobile: images not lazy-loaded", status: ready_qa, assignee: sofia, author: marco, priority: Medium, sprint: current, category: "Catalogue",
        severity: Minor, environment: QA, platform: Web, found_in: "3.4.0", fixed_in: "3.5.0-rc.2" }
    - { ref: bug_cart_badge, type: bug, subject: "Cart badge shows items from the previous session after logout", status: reopened, assignee: sofia, author: lena, priority: High, sprint: current, version: "Web 3.5.0", category: "Account",
        severity: Major, environment: QA, platform: Web, found_in: "3.5.0-rc.1", fixed_in: "3.5.0-rc.2",
        description: "**Steps to reproduce**\n1. Log in, add 2 items to the cart\n2. Log out via the account menu\n3. Look at the cart badge in the header\n\n**Expected result**\nBadge is empty.\n\n**Actual result**\nBadge still shows 2 until a hard refresh." }
    - { ref: bug_trailing_space, type: bug, subject: "Search returns no results when the query ends with a space", status: done, assignee: rafi, author: lena, priority: Medium, sprint: previous, version: "Web 3.4.0", category: "Search",
        severity: Minor, environment: QA, platform: Web, found_in: "3.4.0-rc.3", fixed_in: "3.4.0" }
    - { ref: bug_postcode, type: bug, subject: "Address form accepts invalid UK postcodes", status: in_qa, assignee: priya, author: lena, priority: Medium, sprint: current, category: "Account",
        severity: Minor, environment: QA, platform: Web, found_in: "3.5.0-rc.1", fixed_in: "3.5.0-rc.2" }
    - { ref: bug_email_tz, type: bug, subject: "Order confirmation email shows UTC instead of the shopper's local time", status: todo, assignee: rafi, author: nusrat, priority: Medium, category: "Checkout",
        severity: Minor, environment: Production, platform: Web, found_in: "3.4.0" }
    - { ref: bug_rate_limit, type: bug, subject: "Login locks accounts after 3 failed attempts instead of 5", status: ready_qa, assignee: rafi, author: marco, priority: High, sprint: current, category: "Account",
        severity: Major, environment: Staging, platform: Web, found_in: "3.5.0-rc.1", fixed_in: "3.5.0-rc.2" }
    - { ref: bug_safari, type: bug, subject: "Mini-cart dropdown overlaps the header on Safari 17", status: todo, assignee: sofia, author: lena, priority: Low, category: "Catalogue",
        severity: Trivial, environment: QA, platform: Web, found_in: "3.5.0-rc.2" }
    - { ref: web_release_ms, type: milestone, subject: "Web 3.5.0 release", status: todo, assignee: daniel, author: daniel, version: "Web 3.5.0", start: 11, due: 11 }
    - { ref: web_cr_vat, type: change_request, subject: "Show the customer's VAT number on invoices", status: todo, author: ayesha, priority: Medium, category: "Payments", requested_by: "Support (Orbit Logistics)", impact: "Medium",
        description: "**Requested change**\nPrint the VAT number from the billing profile on the invoice PDF.\n\n**Reason for change**\nBusiness customers need it for their accounting; three requests this month.\n\n**Impact**\nSmall: one template and one profile field. No schedule risk." }
    - { ref: sr_checkout_500, type: support_request, subject: "Customer sees \"Something went wrong\" when paying with a card that expires this month", status: in_progress, assignee: lena, author: lena, priority: Critical, category: "Payments",
        customer: "Contoso Retail", channel: "Email", impact: "High",
        description: "**Customer request**\nThree of their buyers could not complete an order today. Card expires 11/2026.\n\n**Customer and account**\nContoso Retail, Business plan, about 40 buyers.\n\n**Already tried**\nReproduced with a test card that expires this month; the payment request returns a 500.\n\n**Escalation**\nBlocked by the open payment bug; told the customer to use another card for now." }
    - { ref: sr_password_reset, type: support_request, subject: "Password reset email never arrives for @northwind.example addresses", status: waiting, assignee: lena, author: lena, priority: High, category: "Account",
        customer: "Northwind Traders", channel: "Email", impact: "Medium",
        description: "**Customer request**\nTwo employees cannot reset their password; no email arrives, spam folder checked.\n\n**Customer and account**\nNorthwind Traders, Team plan, 12 users.\n\n**Already tried**\nResent twice from the admin panel. Our mail log shows the message was delivered to their server.\n\n**Reply sent / resolution**\nAsked their IT to allow-list our sender address." }
    - { ref: sr_refund, type: support_request, subject: "Refund for a duplicate charge on order #48213 has not arrived", status: reopened, assignee: lena, author: marco, priority: High, category: "Payments",
        customer: "Brightside Cafe", channel: "Live chat", impact: "High",
        description: "**Customer request**\nCharged twice for the same order. A refund was issued 5 days ago but the customer still does not see it.\n\n**Customer and account**\nBrightside Cafe, Starter plan.\n\n**Already tried**\nRefund reference confirmed in the payment dashboard." }
    - { ref: sr_vat_invoice, type: support_request, subject: "Invoice must show our VAT number", status: in_progress, assignee: marco, author: marco, priority: Medium, category: "Payments",
        customer: "Orbit Logistics", channel: "Customer portal", impact: "Medium",
        description: "**Customer request**\nTheir accountants reject invoices without the VAT number.\n\n**Customer and account**\nOrbit Logistics, Business plan.\n\n**Reply sent / resolution**\nSent a manually edited invoice. Change request raised for the permanent fix." }
    - { ref: sr_csv_export, type: support_request, subject: "How do I export my order history as CSV?", status: done, assignee: marco, author: marco, priority: Low, category: "Account",
        customer: "Greenleaf Stores", channel: "Customer portal", impact: "Low",
        description: "**Customer request**\nWants a spreadsheet of all orders for the year.\n\n**Reply sent / resolution**\nExplained Account > Orders > Export. Customer confirmed it worked." }


# Team handbook in the ShopEase wiki: how the team uses Neurvo day to day.
wiki_pages:
  - project: SHOP
    title: "Team handbook"
    author: ayesha
    text: |
      # Team handbook

      How the ShopEase team plans, builds, tests and ships. If something here no longer matches how we work, change the page.

      - [[Workflow and definition of done]]
      - [[Bug lifecycle and severity]]
      - [[Support process]]
      - [[Sprint rituals]]
      - [[Release checklist]]

      ## Where things live

      | What | Where |
      |---|---|
      | Product-wide bugs | **SQA Defects** board in ShopEase |
      | Web work | Web Kanban board and the backlog in ShopEase Web |
      | Mobile work | Backlog in ShopEase Mobile |
      | Infrastructure | Platform & DevOps |
      | Ideas from customers | Feature Request; scope changes after commitment: Change Request |
      | Customer questions and problems | **Support Queue** board in ShopEase (Support Request) |

      Create anything from **+ Create** in the header (or press **c**). Search with **⌘K** / **Ctrl+K**.
  - project: SHOP
    title: "Workflow and definition of done"
    parent: "Team handbook"
    author: daniel
    text: |
      # Workflow and definition of done

      **To Do → In Progress → In Review → Ready for QA → In QA → Done**

      Side states: **Blocked** (say why in a comment and link the blocker), **Reopened** (bugs that failed QA), **Won't Do**.

      | Status | Who moves it | When |
      |---|---|---|
      | In Progress | Assignee | You start working; one item at a time where possible |
      | In Review | Assignee | Pull request open and linked |
      | Ready for QA | Reviewer / assignee | Merged and deployed to QA; fill in **Fixed in build** |
      | In QA | QA engineer | Testing has started |
      | Done | QA engineer | Acceptance criteria verified on QA or staging |
      | Reopened | QA engineer | Fails verification; comment with steps and evidence |

      ## Definition of ready

      - Clear acceptance criteria (stories) or steps to reproduce (bugs)
      - Estimated in story points
      - No open questions for product

      ## Definition of done

      - Code reviewed and merged, CI green
      - Unit and integration tests added or updated
      - QA verified; automated regression added where it makes sense
      - Release notes line written for user-facing changes
  - project: SHOP
    title: "Bug lifecycle and severity"
    parent: "Team handbook"
    author: nusrat
    text: |
      # Bug lifecycle and severity

      Every bug gets **Severity**, **Environment**, **Platform** and **Found in build**. The Bug template asks for
      steps to reproduce, expected and actual result, and evidence.

      | Severity | Meaning | Response |
      |---|---|---|
      | Critical | Data loss, payments broken, crash for many users, security issue | Fix now; blocks the release |
      | Major | Core feature broken, no reasonable workaround | Fix in the current sprint |
      | Minor | Feature works with a workaround or limited impact | Plan in the next sprints |
      | Trivial | Cosmetic | When convenient |

      **Priority** is the business decision (when we fix it); **Severity** is the technical impact (how bad it is).

      ## Triage

      Bug triage every Wednesday at 11:00: confirm severity, assign an owner, put it in a sprint or close it.
      Production bugs are triaged the same day by the QA lead.
  - project: SHOP
    title: "Support process"
    parent: "Team handbook"
    author: ayesha
    text: |
      # Support process

      Every customer question or problem becomes a **Support Request** (**+ Create > Support Request**). The **Support Queue** board and the **Support queue** view show what is open.

      ## Fields

      | Field | What to enter |
      |---|---|
      | Customer | Company or account name |
      | Support channel | Where it came in: Email, Live chat, Phone, Customer portal, In-app |
      | Business impact | How badly the customer is affected: High, Medium, Low |
      | Priority | See the response targets below |

      ## Response targets

      | Priority | First reply | Updates |
      |---|---|---|
      | Critical | 1 hour | every 4 hours until resolved |
      | High | 4 hours | daily |
      | Medium | 1 business day | every 2 business days |
      | Low | 2 business days | on resolution |

      ## Statuses

      - **To Do**: new, not picked up yet.
      - **In Progress**: someone is working on it.
      - **Waiting on Customer**: we asked a question; the response clock is paused.
      - **Reopened**: the customer replied again after we closed it.
      - **Done**: the customer confirmed, or did not reply for 5 days.
      - **Won't Do**: out of scope or a duplicate; say why in a comment.

      ## Escalating to engineering

      When a fix or a change is needed, create a **Bug**, **Feature Request** or **Change Request**, link it to the support request with **Relations > relates to**, and keep talking to the customer in the support request. Lena is the primary support owner this quarter, Marco the backup.
  - project: SHOP
    title: "Sprint rituals"
    parent: "Team handbook"
    author: daniel
    text: |
      # Sprint rituals

      Two-week sprints, Monday to Friday.

      | Ritual | When | Length |
      |---|---|---|
      | Daily stand-up | Every working day 09:30 | 15 min |
      | Bug triage | Wednesday 11:00 | 30 min |
      | Sprint review & retrospective | Last Friday of the sprint 15:00 | 60 min |
      | Sprint planning | First Monday of the sprint 10:00 | 90 min |

      Each sprint has a **sprint goal** (see Backlogs). Stand-up walks the board from right to left: what is
      closest to done gets attention first.
  - project: SHOP
    title: "Release checklist"
    parent: "Team handbook"
    author: tanvir
    text: |
      # Release checklist

      - [ ] No open Critical or Major bugs for the version
      - [ ] Regression suite green on staging
      - [ ] Release notes reviewed by product
      - [ ] Database migrations reviewed; rollback plan written
      - [ ] Go/no-go meeting held and decision recorded
      - [ ] Monitoring dashboards and on-call ready
      - [ ] Version closed in Neurvo after release

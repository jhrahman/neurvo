wiki_pages:
  - title: "QuickCart overview"
    author: ayesha
    text: |
      # QuickCart

      QuickCart is an e-commerce platform for online retailers: a fast storefront, one-page checkout, search, inventory and self-service returns.

      - [[QuickCart architecture]]
      - [[Checkout v2 requirements]]
      - [[Runbook: payment failures]]
      - [[QuickCart support process]]

      ## Business goals this quarter

      | Goal | Metric | Target |
      |---|---|---|
      | Higher conversion | Checkout conversion | +8% |
      | Faster shopping | Category page LCP on mobile | under 2.5 s |
      | Fewer stock-outs after purchase | Orders cancelled for stock | under 0.5% |
      | Less support load | Tickets per 1,000 orders | under 6 |

      ## Where things live

      | What | Where |
      |---|---|
      | Sprint work | **Sprint board** |
      | Defects | **Bug triage** board, **Open bugs** view |
      | Release scope | **Release plan** board, **Release 5.9.0 scope** view |
      | Customer issues | **Support queue** board |
      | Ideas and scope changes | **Feature and change requests** view |

      ## Contacts

      Product: Ayesha Karim. Tech lead: Daniel Brooks. QA lead: Nusrat Jahan. Design: Maya Patel.
  - title: "QuickCart architecture"
    parent: "QuickCart overview"
    author: daniel
    text: |
      # QuickCart architecture

      ```
      Shopper ── CDN ── Storefront (Next.js, server-side rendering)
                              │
                              ├── Catalogue API ── Postgres + Elasticsearch (search)
                              ├── Cart and checkout API ── Redis (cart) ── Orders DB
                              ├── Payments service ── PSP (cards, 3-D Secure, wallets)
                              └── Inventory service ── warehouse system (stock events)
      ```

      ## Key flows

      - **Browse and search**: the storefront renders category pages on the server and caches them at the CDN; search queries go to Elasticsearch with typo tolerance behind a flag.
      - **Checkout**: the cart lives in Redis, the order is created in one transaction after the PSP confirms payment; failures leave the cart intact.
      - **Stock**: the warehouse emits stock events; the inventory service updates availability within 60 s; checkout reserves stock for 10 minutes.

      ## Targets

      | Area | Target |
      |---|---|
      | Category page LCP (mobile, p75) | under 2.5 s |
      | Search | p95 under 250 ms |
      | Checkout API | p95 under 400 ms, 99.95% availability during campaigns |
      | Peak load | 1,500 orders per minute |

      ## Decisions

      - **ADR-001** Server-side rendering with edge caching over a client-only SPA, for SEO and LCP.
      - **ADR-002** One PSP integration behind our own payments service so providers can be switched.
      - **ADR-003** Stock reservation instead of decrementing at payment, to avoid overselling during peaks.
  - title: "Checkout v2 requirements"
    parent: "QuickCart overview"
    author: ayesha
    text: |
      # Checkout v2: one-page checkout

      **Status**: in development for 5.9.0. **Owner**: Ayesha Karim. **Design**: Maya Patel (prototype linked in the epic).

      ## Problem

      The four-step checkout loses 38% of shoppers between cart and payment, and takes 3 minutes 40 seconds on average.

      ## Goals

      - Raise checkout conversion by 8%
      - Cut the time to order by 30%
      - Keep payment failures below 1.5%

      ## User flow

      1. Cart review (inline edit of quantity and promo code)
      2. Delivery address and method on the same page
      3. Payment (saved card, new card, wallets in 5.10)
      4. Confirmation page and email

      ## Functional requirements

      | ID | Requirement | Priority |
      |---|---|---|
      | CK-1 | Single page with all sections visible, validating inline | Must |
      | CK-2 | Pay with a saved card, including 3-D Secure without leaving the page | Must |
      | CK-3 | Apply and remove promo codes without a page reload | Must |
      | CK-4 | Guest checkout with only an email address | Should (5.10) |
      | CK-5 | Express pay with Apple Pay and Google Pay | Should (5.10) |

      ## Analytics events

      `checkout_started`, `payment_method_selected`, `promo_applied`, `order_placed`, `payment_failed` (with error code).

      ## Risks

      - Payment errors on expiring cards (see the open bug on the release scope)
      - Promo totals must stay correct after removing a code
      - Accessibility: the page must pass WCAG 2.1 AA with keyboard-only use

      ## Rollout

      Behind a feature flag: 5% of traffic, then 25%, 50%, 100% over one week, watching conversion and `payment_failed`.
  - title: "Runbook: payment failures"
    parent: "QuickCart overview"
    author: tanvir
    text: |
      # Runbook: payment failures

      **Alert**: `checkout_error_rate > 2%` for 5 minutes (pages the on-call engineer). **Severity**: SEV1 during campaigns, otherwise SEV2.

      ## Triage

      1. Open the **Checkout** dashboard: error rate by error code and by payment method.
      2. If one code dominates (for example `CardExpiredError`), find the commit or flag change in the last 24 hours and consider disabling the flag.
      3. If the PSP shows an incident on its status page, switch the storefront to the **fallback message** and keep carts intact; do not retry payments automatically.
      4. If only 3-D Secure fails, check the redirect URL and the CSP headers after the last deployment.

      ## Mitigations

      - Disable the one-page checkout flag: `flags set checkout_v2 off` (shoppers fall back to the four-step flow).
      - Roll back the payments service: `./deploy rollback payments production`.

      ## Communicate

      Update `#inc-checkout` every 30 minutes; tell support which payment methods are affected and the workaround.

      ## Afterwards

      Postmortem within 3 working days; link the tickets. Example: the backup-failure postmortem in the Platform & DevOps wiki.
  - title: "QuickCart support process"
    parent: "QuickCart overview"
    author: ayesha
    text: |
      # Support process

      Every customer question or problem becomes a **Support Request** (**+ Create > Support Request**). The **Support queue** board and view show what is open.

      ## Fields

      | Field | What to enter |
      |---|---|
      | Customer | Company or account name |
      | Support channel | Email, Live chat, Phone, Customer portal or In-app |
      | Business impact | High, Medium or Low |
      | Priority | See the response targets |

      ## Response targets

      | Priority | First reply | Updates |
      |---|---|---|
      | Critical | 1 hour | every 4 hours until resolved |
      | High | 4 hours | daily |
      | Medium | 1 business day | every 2 business days |
      | Low | 2 business days | on resolution |

      ## Statuses

      - **To Do**: new, not picked up yet.
      - **In Progress**: someone is working on it.
      - **Waiting on Customer**: we asked a question; the response clock is paused.
      - **Reopened**: the customer replied again after we closed it.
      - **Done**: confirmed by the customer, or no reply for 5 days.
      - **Won't Do**: out of scope or a duplicate; say why in a comment.

      ## Escalating to engineering

      Create a **Bug**, **Feature Request** or **Change Request**, link it with **Relations > relates to** and keep talking to the customer in the support request. Marco is the primary support owner this quarter, Ayesha the backup for commercial questions.

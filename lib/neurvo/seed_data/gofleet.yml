wiki_pages:
  - title: "GoFleet overview"
    author: imran
    text: |
      # GoFleet

      GoFleet is a web platform for urban transport operators. Riders book trips, dispatchers assign and track vehicles on a live map, and drivers work from the Driver app.

      - [[GoFleet architecture]]
      - [[GoFleet test strategy]]
      - [[Runbook: live tracking outage]]

      ## Who uses it

      | Role | Needs | Where |
      |---|---|---|
      | Rider | Book, track and pay for a trip | Booking web app |
      | Dispatcher | Assign vehicles, watch the fleet, handle exceptions | Dispatcher dashboard |
      | Driver | Receive and complete trips | Driver app (Android, iOS) |
      | Fleet admin | Onboard drivers, billing, reports | Admin console |

      ## Where things live

      | What | Where |
      |---|---|
      | Sprint work | **Sprint board** |
      | Defects | **Bug triage** board and the **Open bugs** view |
      | Release scope | **Release plan** board and the **Release 2.5.0 scope** view |
      | Customer issues | **Support queue** board |

      ## Roadmap

      - **2.5.0** (this month): smart dispatch, live map, Driver app trip flow
      - **2.6.0** (next month): offline sync, geofence alerts, corporate invoicing
      - **Later**: recurring rides, rider ratings, pooled rides

      ## Contacts

      Product: Imran Chowdhury. Tech lead: Daniel Brooks. QA lead: Nusrat Jahan. On-call rotation: see [[Runbook: live tracking outage]].
  - title: "GoFleet architecture"
    parent: "GoFleet overview"
    author: daniel
    text: |
      # GoFleet architecture

      ## Components

      ```
      Rider web app ─┐                      ┌─ Dispatch service ── PostGIS (drivers, trips)
                     ├─ API gateway ───────┤
      Dispatcher UI ─┘        │             ├─ Tracking gateway (WebSocket) ── Redis (last position)
                              │             ├─ Billing service ── PSP
      Driver app ──── push (FCM / APNs) ────┘
                              │
                              └── Kafka (trip, location and payment events) ── Analytics
      ```

      ## A trip from request to completion

      1. The rider submits a booking; the gateway checks the **idempotency key** and creates the trip (state `requested`).
      2. The dispatch service queries PostGIS for free drivers within 5 km and offers the trip to the best candidate by push.
      3. The driver accepts within 20 s; otherwise the next candidate is offered (state `offered` to `assigned`).
      4. The driver app streams its position every 3 s; the tracking gateway fans it out to the rider and dispatcher.
      5. On completion billing calculates the fare, charges the PSP and emits `trip.completed`.

      ## Non-functional targets

      | Area | Target |
      |---|---|
      | Dispatch decision | median under 8 s, p95 under 20 s |
      | Location latency | under 3 s end to end |
      | API | p95 under 300 ms, 99.9% monthly availability |
      | Data | trips kept 7 years; location history 90 days |

      ## Decisions (ADRs)

      - **ADR-001** PostGIS for geo queries instead of an external geo service: one fewer moving part, easy to test locally.
      - **ADR-002** WebSocket with heartbeat and server-side resume for tracking; polling was too heavy on batteries and servers.
      - **ADR-003** Kafka for events so analytics and billing do not couple to the request path.
      - **ADR-004** Every state-changing endpoint accepts an `Idempotency-Key` (see the duplicate-booking bug).
  - title: "GoFleet test strategy"
    parent: "GoFleet overview"
    author: nusrat
    text: |
      # Test strategy

      ## Pyramid

      | Level | Owner | Tooling | Runs |
      |---|---|---|---|
      | Unit | Developers | Jest, JUnit | every pull request |
      | Contract and API | Developers + QA | Pact, Postman | every pull request |
      | UI end-to-end | QA automation | Playwright, Detox | on merge, nightly |
      | Exploratory | QA | charters per release | each release candidate |
      | Performance | QA + DevOps | k6 | weekly and before release |

      ## Device and browser matrix

      - Web: latest Chrome, Firefox, Safari 17, Edge
      - Android: Pixel 7 (Android 14), Galaxy A54 (Android 14), Redmi Note 11 (Android 12)
      - iOS: iPhone 13 (iOS 17), iPhone 15 (iOS 17)

      ## Special cases for GoFleet

      - **GPS simulation**: recorded city routes replayed through the location API, including tunnels and signal loss.
      - **Concurrency**: 500 simultaneous ride requests must not create duplicate trips or double-assign a driver.
      - **Time zones**: operators in at least three time zones in the regression data.

      ## Exit criteria for a release

      - No open Critical or Major bugs; Minor bugs have an owner and a target version
      - Regression suite green on staging for two consecutive runs
      - Load test meets the targets in [[GoFleet architecture]]
      - Go/no-go meeting held and recorded
  - title: "Runbook: live tracking outage"
    parent: "GoFleet overview"
    author: tanvir
    text: |
      # Runbook: live tracking outage

      **Severity**: SEV2 when vehicles stop moving on the dispatcher map; SEV1 when drivers cannot receive trips too.

      ## Symptoms

      - Alert: `tracking_latency_p95 > 5s` or `ws_connections` drops by more than 30% in 5 minutes
      - Dispatchers report frozen markers; support tickets mention "map not updating"

      ## First 15 minutes

      1. Acknowledge the page and open an incident channel `#inc-tracking`.
      2. Check the dashboard **Tracking gateway**: connections, message rate, Redis latency.
      3. If the gateway pods restart repeatedly: `kubectl -n gofleet logs deploy/tracking-gateway --previous` and look for out-of-memory or Redis errors.
      4. If Redis is slow: fail over to the replica (`./ops redis failover`) and watch latency.
      5. If a deployment started in the last 30 minutes: roll back with `./deploy rollback production`.

      ## Communicate

      - Post an update every 30 minutes in the incident channel and on the status page.
      - Tell support which operators are affected and give them the workaround: dispatchers can use the **list view**, which polls every 15 s.

      ## After

      Write a blameless postmortem within 3 working days (template in the engineering handbook) and create follow-up tickets linked to the incident.

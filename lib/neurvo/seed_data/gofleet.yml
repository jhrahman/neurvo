    sprint: current
    category: "Dispatch"
    severity: Critical
    environment: Production
    platform: Web
    found_in: "2.4.0"
    description: |
      **Steps to reproduce**
      1. Open the booking page and enter pickup and drop-off
      2. Double-tap **Book** quickly (or use a slow 3G profile)
      3. Open **My trips**

      **Expected result**
      One trip is created and the button is disabled after the first tap.

      **Actual result**
      Two trips are created; the rider is charged a pre-authorisation twice and two drivers are dispatched.

      **Evidence**
      Request log shows two POST /v2/trips within 180 ms, no idempotency key.

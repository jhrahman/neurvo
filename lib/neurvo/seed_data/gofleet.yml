    type: story
    subject: "Match ride requests to the nearest available driver"
    status: in_progress
    assignee: priya
    author: imran
    priority: High
    sprint: current
    points: 8
    version: "GoFleet 2.5.0"
    category: "Dispatch"
    description: |
      **As a** dispatcher **I want** new ride requests assigned to the nearest free driver **so that** riders wait less and I can focus on exceptions.

      **Acceptance criteria**
      - [x] Candidates are drivers within 5 km who are online and not on a trip
      - [x] Ties are broken by acceptance rate over the last 30 days
      - [ ] If nobody accepts within 20 s the request is offered to the next driver
      - [ ] Assignment is idempotent: retries never create a second assignment
      - [ ] Decision is logged with the candidates considered (for audits)

      **Out of scope**
      Pooled rides and multi-stop trips.

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neurvo demo</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: #0d1117; color: #e6edf3; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  p.sub { margin: 0 0 16px; color: #9da7b3; }
  video { width: 100%; border-radius: 10px; background: #000; box-shadow: 0 8px 32px rgba(0,0,0,.5); }
  ul { list-style: none; padding: 0; margin: 20px 0 0; display: flex; flex-wrap: wrap; gap: 8px; }
  button { font: inherit; font-size: .875rem; color: #e6edf3; background: #161b22; border: 1px solid #30363d; border-radius: 999px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: #58a6ff; color: #58a6ff; }
  a { color: #58a6ff; }
  footer { margin-top: 28px; color: #9da7b3; font-size: .875rem; }
</style>
</head>
<body>
<main>
  <h1>Neurvo in three minutes</h1>
  <p class="sub">A 1080p, 60 fps tour of the sample workspace. Every person and company in it is fictional.</p>
  <video id="v" controls preload="metadata" poster="poster.jpg" playsinline>
    <source src="neurvo-demo.webm" type="video/webm">
    Your browser cannot play WebM video.
  </video>
  <ul id="chapters"></ul>
  <footer>Use the player's menu for playback speed. <a href="https://github.com/jhrahman/neurvo">Back to the repository</a>.</footer>
</main>
<script>
  const chapters = [
    ['Sign in', 0], ['Home', 7], ['Light and dark themes', 14], ['Account settings', 43], ['Projects', 56],
    ['Bug triage board', 63], ['Sprint board', 81], ['Support queue', 99], ['New task and comment', 112],
    ['New bug and @mention', 136], ['Commenter profile', 163], ['Sign out', 175]
  ];
  const v = document.getElementById('v'), ul = document.getElementById('chapters');
  for (const [label, at] of chapters) {
    const li = document.createElement('li'), b = document.createElement('button');
    b.textContent = Math.floor(at / 60) + ':' + String(at % 60).padStart(2, '0') + '  ' + label;
    b.onclick = () => { v.currentTime = at; v.play(); };
    li.appendChild(b); ul.appendChild(li);
  }
</script>
</body>
</html>
